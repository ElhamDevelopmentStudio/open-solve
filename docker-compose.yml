version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/opensolve?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/opensolve?schema=public
      JUDGE_RABBIT_URL: amqp://opensolve:opensolve@rabbitmq:5672
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opensolve
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d opensolve -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T18-10-14Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opensolve}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-opensolve-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-mc:
    image: minio/mc:RELEASE.2024-12-13T22-19-12Z
    profiles:
      - storage
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-opensolve-assets}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opensolve}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-opensolve-secret}
    entrypoint: >
      /bin/sh -c "
        set -euo pipefail;
        echo '⏳ Waiting for MinIO...';
        until mc alias set local http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
          sleep 2;
        done;
        echo '✅ MinIO reachable, ensuring bucket $MINIO_BUCKET exists';
        mc mb --ignore-existing local/$MINIO_BUCKET;
        exit 0;
      "

  judge-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: judge-worker
    command: ["npm", "run", "judge:worker"]
    profiles:
      - judge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/opensolve?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/opensolve?schema=public
      JUDGE_RABBIT_URL: amqp://opensolve:opensolve@rabbitmq:5672
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: opensolve
      RABBITMQ_DEFAULT_PASS: opensolve
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  minio-data:

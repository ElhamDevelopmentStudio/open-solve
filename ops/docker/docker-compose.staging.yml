services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../env/staging.env
    environment:
      PORT: 3000
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: judge-worker
    command: ["npm", "run", "judge:worker"]
    env_file:
      - ../env/staging.env
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T18-10-14Z
    command: server /data --console-address ":9001"
    env_file:
      - ../env/staging.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opensolve}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-opensolve-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-mc:
    image: minio/mc:RELEASE.2024-12-13T22-19-12Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../env/staging.env
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-opensolve-assets}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opensolve}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-opensolve-secret}
    entrypoint: >
      /bin/sh -c "
        set -euo pipefail;
        echo '⏳ waiting for MinIO...';
        until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
          sleep 2;
        done;
        echo '✅ bucket bootstrap complete';
        mc mb --ignore-existing local/$$MINIO_BUCKET;
        exit 0;
      "

volumes:
  minio-data:
